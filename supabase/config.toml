# Configuración para la CLI de Supabase (supabase link / db push / functions deploy).
project_id = "camila-love-app"

[auth]
# Sólo el super administrador crea cuentas (desde el panel): nadie puede
# registrarse por su cuenta.
enable_signup = false
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/entrar"]
minimum_password_length = 10
# Cada refresco entrega un token nuevo y el anterior deja de servir.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
jwt_expiry = 3600

[auth.email]
enable_signup = false
enable_confirmations = true

# Correo de recuperación con enlace a /recuperar#token_hash=… (sirve en otro
# dispositivo). En producción lo aplica el flujo Deploy cuando hay SMTP propio.
[auth.email.template.recovery]
subject = "Crea tu contraseña nueva 🔑"
content_path = "./supabase/templates/recovery.html"

[functions.admin-users]
verify_jwt = true

[functions.send-push]
# La invoca la base de datos (pg_net) con su propio secreto, no un usuario.
verify_jwt = false

[functions.redeem-invite]
# La llama quien todavía no tiene cuenta; la protege el token de la invitación.
verify_jwt = false
