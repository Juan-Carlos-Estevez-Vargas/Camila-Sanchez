# Netlify compila la app con Vite y publica dist/. Las cabeceras de seguridad
# y la regla de la SPA viven en public/_headers y public/_redirects.
# Las variables VITE_* se ponen en Netlify → Site configuration → Environment
# variables (nunca en este archivo: el repositorio es público).
[build]
  # Los tags vX.Y.Z dan la versión que muestra el pie de página.
  command = "(git fetch --unshallow --tags --force --quiet || git fetch --tags --force --quiet || true) && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
