name: Reportar un error
description: Algo no funciona como debería.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el error con tus palabras.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entra a /chat
        2. Envía una foto
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Dónde ocurre
      options:
        - Sitio en producción
        - Modo demo en local
        - Ambos
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: "iPhone 15, Safari 18 (app instalada en inicio)"
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o registros
      description: Quita cualquier dato personal antes de pegarlos.
