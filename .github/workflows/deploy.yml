# Despliegue automático del backend en cada merge a main o master.
#
#   1. Aplica las migraciones nuevas de supabase/migrations (y el contenido
#      inicial de seed.sql la primera vez).
#   2. Ajusta el inicio de sesión: dominio, URLs de retorno y registro cerrado.
#   3. Publica las Edge Functions y deja listos los avisos push al celular
#      (crea las claves la primera vez y conecta la base de datos con
#      send-push mediante Supabase Vault).
#   4. Crea un release vX.Y.Z en GitHub con las notas de lo que cambió.
#
# La web la vuelve a publicar Netlify sola con cada merge (integración con Git
# y netlify.toml).
#
# Configuración (Settings → Secrets and variables → Actions), una sola vez:
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#              (opcionales: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
#               y PUSH_WEBHOOK_SECRET; si no están, el flujo los genera una vez
#               y los guarda en Supabase)
#              (opcionales, para que los correos de recuperación lleguen a
#               cualquiera: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
#               SMTP_SENDER_EMAIL)
#   Variables: SUPABASE_PROJECT_REF, SITE_URL (p. ej. https://camila-sanchez.netlify.app)
# Mientras falten, el flujo termina en verde avisando qué falta.
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Revisar configuración
        id: config
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secreto SUPABASE_ACCESS_TOKEN,"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing secreto SUPABASE_DB_PASSWORD,"
          [ -n "$PROJECT_REF" ] || missing="$missing variable SUPABASE_PROJECT_REF,"
          [ -n "$SITE_URL" ] || missing="$missing variable SITE_URL,"
          if [ -n "$missing" ]; then
            echo "::notice::Supabase aún no está configurado (falta:${missing%,}). No se desplegó nada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Pruebas (incluidas las de seguridad de la base de datos)
        if: steps.config.outputs.ready == 'true'
        run: npm ci && npm run check

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.config.outputs.ready == 'true'
        with:
          version: 2.121.0

      - name: Aplicar migraciones
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Configurar inicio de sesión
        if: steps.config.outputs.ready == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_EMAIL: ${{ secrets.SMTP_SENDER_EMAIL }}
        run: |
          site="${SITE_URL%/}"
          # Registro cerrado (tampoco cuentas anónimas), contraseñas de 10+
          # caracteres, tokens de 1 h, rotación de tokens de refresco (uno
          # robado deja de servir al usarse), cambio de correo confirmado en
          # los dos correos y límites de intentos para frenar la fuerza bruta.
          body=$(jq -n --arg site "$site" '{
            site_url: $site,
            uri_allow_list: ($site + "/**"),
            disable_signup: true,
            external_anonymous_users_enabled: false,
            password_min_length: 10,
            jwt_exp: 3600,
            refresh_token_rotation_enabled: true,
            security_refresh_token_reuse_interval: 10,
            mailer_secure_email_change_enabled: true,
            rate_limit_verify: 30,
            rate_limit_token_refresh: 150
          }')
          # Con un servidor de correo propio, los correos de recuperación llegan a
          # cualquier cuenta y su enlace (/recuperar#token_hash=…) sirve aunque se
          # abra en otro dispositivo. Sin él, Supabase sólo envía a los miembros
          # de su equipo y el enlace exige el mismo navegador.
          if [ -n "$SMTP_HOST" ] && [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            body=$(jq --arg host "$SMTP_HOST" --arg port "${SMTP_PORT:-465}" \
              --arg user "$SMTP_USER" --arg pass "$SMTP_PASS" \
              --arg sender "${SMTP_SENDER_EMAIL:-$SMTP_USER}" \
              --rawfile template supabase/templates/recovery.html '. + {
                smtp_host: $host, smtp_port: $port, smtp_user: $user, smtp_pass: $pass,
                smtp_admin_email: $sender, smtp_sender_name: "Nuestro rincón",
                rate_limit_email_sent: 30,
                mailer_subjects_recovery: "Crea tu contraseña nueva 🔑",
                mailer_templates_recovery_content: $template
              }' <<< "$body")
          else
            echo "::notice::Sin SMTP propio: los correos de recuperación sólo llegan a los miembros del equipo de Supabase. Usa el enlace 🔑 de Administración → Usuarios para los demás."
          fi
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" > /dev/null

      - name: Publicar Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" "ALLOWED_ORIGIN=${SITE_URL%/}"
          supabase functions deploy admin-users --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy redeem-invite --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      # Avisos al celular (Web Push). Las claves se crean una sola vez y quedan
      # guardadas como secretos de Supabase; si se cambiaran, los celulares
      # tendrían que volver a activar los avisos. Nada de esto se imprime.
      - name: Configurar avisos push
        if: steps.config.outputs.ready == 'true'
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_WEBHOOK_SECRET: ${{ secrets.PUSH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$PROJECT_REF"
          sql() {
            jq -n --arg q "$1" '{query: $q}' | curl --fail-with-body -sS -X POST "$api/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-
          }
          existing=$(supabase secrets list --project-ref "$PROJECT_REF")
          has_secret() { grep -qw "$1" <<< "$existing"; }

          # 1. Claves VAPID: las de GitHub si existen; si no, se generan una vez.
          if [ -n "$VAPID_PRIVATE_KEY" ] && [ -n "$VAPID_PUBLIC_KEY" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" \
              "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY" > /dev/null
          elif ! has_secret VAPID_PRIVATE_KEY; then
            keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            pub=$(jq -r .publicKey <<< "$keys"); priv=$(jq -r .privateKey <<< "$keys")
            echo "::add-mask::$priv"
            supabase secrets set --project-ref "$PROJECT_REF" "VAPID_PUBLIC_KEY=$pub" "VAPID_PRIVATE_KEY=$priv" > /dev/null
            echo "::notice::Se crearon las claves de los avisos push."
          fi
          subject="${VAPID_SUBJECT:-${SITE_URL%/}}"
          supabase secrets set --project-ref "$PROJECT_REF" "VAPID_SUBJECT=$subject" > /dev/null

          # 2. Secreto entre la base de datos y send-push, guardado en los dos
          #    lados (secreto de la función y Supabase Vault).
          in_vault=$(sql "select count(*)::int as n from vault.secrets where name = 'push_webhook_secret'" | jq '.[0].n')
          secret="$PUSH_WEBHOOK_SECRET"
          if [ -z "$secret" ] && { [ "$in_vault" != "1" ] || ! has_secret PUSH_WEBHOOK_SECRET; }; then
            secret=$(openssl rand -hex 32)
          fi
          if [ -n "$secret" ]; then
            echo "::add-mask::$secret"
            if ! [[ "$secret" =~ ^[A-Za-z0-9_-]{16,}$ ]]; then
              echo "::error::PUSH_WEBHOOK_SECRET sólo puede tener letras, números, - y _ (mínimo 16)."; exit 1
            fi
            supabase secrets set --project-ref "$PROJECT_REF" "PUSH_WEBHOOK_SECRET=$secret" > /dev/null
            url="https://$PROJECT_REF.supabase.co/functions/v1/send-push"
            sql "do \$\$ declare sid uuid; begin
              select id into sid from vault.secrets where name = 'push_webhook_secret';
              if sid is null then perform vault.create_secret('$secret', 'push_webhook_secret');
              else perform vault.update_secret(sid, '$secret'); end if;
              select id into sid from vault.secrets where name = 'push_function_url';
              if sid is null then perform vault.create_secret('$url', 'push_function_url');
              else perform vault.update_secret(sid, '$url'); end if;
            end \$\$;" > /dev/null
          fi

          supabase functions deploy send-push --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          echo "::notice::Avisos push listos: cada persona los activa en Mi cuenta → Avisos en este dispositivo."

  # Después de desplegar: versión SemVer calculada a partir de los commits,
  # tag vX.Y.Z y release en GitHub con las notas de lo que cambió
  # (scripts/release.mjs). Si no hay commits nuevos desde el último tag, no
  # crea nada.
  release:
    needs: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Calcular versión y notas
        id: version
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/release.mjs

      - name: Crear release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$NOTES" \
            --latest
          echo "::notice::Release $VERSION publicado."
