# OpenSSF Scorecard: puntúa del 0 al 10 las buenas prácticas del repo (ramas
# protegidas, acciones fijadas por SHA, permisos mínimos, revisión de código,
# dependencias al día...). El resultado sale en Security → Code scanning y en
# la insignia del README.
name: Scorecard

on:
  push:
    branches: [master, main]
  branch_protection_rule:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      # Para publicar el puntaje en scorecard.dev y mostrar la insignia.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
